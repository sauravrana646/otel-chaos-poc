server.port=${SERVER_PORT:8080}

spring.application.name=java-api
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://toxiproxy:5432/poc}
spring.datasource.username=${DB_USER:poc_app}
spring.datasource.password=${DB_PASSWORD:poc_app}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=5000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

poc.analysis.base-url=${ANALYSIS_BASE_URL:http://python-analysis:8080}

logging.level.root=INFO
logging.level.com.example.poc=INFO
