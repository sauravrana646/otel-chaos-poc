# Compatibility lock

Pinned versions for the OrbStack POC. Update only after validating on the target cluster.
Image digests are filled by `./cli/poc build` / Phase A verification.

## Cluster assumptions

| Item | Value |
|------|-------|
| Target runtime | OrbStack Kubernetes (ARM64) |
| Observed K8s (planning) | v1.35.6+orb1 — recheck with `poc doctor` |
| Storage class | local-path |
| Existing GitOps | Argo CD (planning: v3.4.6) |
| Existing Grafana | planning: 12.0.0 |
| Prometheus label for monitors | `release: kube-prometheus-stack` |

## Operators and charts

| Component | Chart / source | Version (pin) | Notes |
|-----------|----------------|---------------|-------|
| CloudNativePG | cloudnative-pg/cloudnative-pg | 0.26.0 (chart) / operator 1.30.x | Confirm K8s 1.35 matrix at implement time |
| OpenTelemetry Operator | open-telemetry/opentelemetry-operator | 0.86.0 (chart) / align with operator release | Restrict webhook to POC namespace |
| cert-manager | jetstack/cert-manager | 1.17.2 | Reuse cluster install if present |
| Tempo | grafana/tempo | 1.18.0 | Single binary / single instance |
| Loki | grafana/loki | 6.27.0 | Single-binary mode |
| OTel Collector | open-telemetry/opentelemetry-collector | 0.110.0 | Central deployment |
| Toxiproxy | shopify/toxiproxy | 2.9.0 | App-namespace Deployment |

> Chart versions above are starting pins for Phase A. Replace with the exact chart+app versions that pass `poc doctor` / bootstrap on your cluster and commit the update.

