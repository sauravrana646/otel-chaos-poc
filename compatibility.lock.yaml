schema_version: 1
validated_on: "2026-10-02"
target:
  runtime: orbstack
  architecture: arm64
  kubernetes_context: orbstack
  storage_class: local-path
  prometheus_monitor_label:
    release: kube-prometheus-stack

prerequisites:
  argocd:
    required: true
    namespace: argocd
  grafana:
    required: true
    namespace: monitoring
  prometheus:
    required: true
    namespace: monitoring
  cert_manager:
    required: true
    crd: certificates.cert-manager.io

components:
  cloudnativepg:
    chart_repository: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    chart_version: 0.26.0
    postgres_image: ghcr.io/cloudnative-pg/postgresql:17
  opentelemetry_operator:
    chart_repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    chart_version: 0.124.0
    java_agent_image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.13.1
  collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
  tempo:
    image: grafana/tempo:2.7.1
  loki:
    image: grafana/loki:3.4.2
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
  k6:
    minimum_version: 0.50.0

application_runtimes:
  java: "21"
  python: "3.12"
  postgresql: "17"

python_instrumentation:
  opentelemetry_api: 1.30.0
  opentelemetry_instrumentation: 0.51b0
  openai_instrumentation: 2.1b0

local_images:
  tag: work-20261002053536
  images:
    java_api: otel-poc/java-api:work-20261002053536
    python_analysis: otel-poc/python-analysis:work-20261002053536
    python_llm: otel-poc/python-llm:work-20261002053536
    llm_mock: otel-poc/llm-mock:work-20261002053536
    python_instrumentation_web: otel-poc/python-instrumentation-web:work-20261002053536
    python_instrumentation_genai: otel-poc/python-instrumentation-genai:work-20261002053536

validation:
  status: gitops-and-smoke-passed
  notes: Argo CD reconciliation and normal, retry-success, retry-exhaust, and streaming trace assertions passed on OrbStack; load and fault acceptance remain separate.
