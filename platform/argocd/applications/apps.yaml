apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-namespaces
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "10"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://github.com/sauravrana646/otel-chaos-poc.git
    targetRevision: main
    path: platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-cnpg-operator
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "30"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.26.0
    helm:
      valuesObject:
        crds:
          create: true
        monitoring:
          podMonitorEnabled: false
          grafanaDashboard:
            create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-poc-cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-otel-operator
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "30"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.124.0
    helm:
      valuesObject:
        manager:
          collectorImage:
            repository: otel/opentelemetry-collector-k8s
        admissionWebhooks:
          namespaceSelector:
            matchLabels:
              otel-injection: enabled
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-poc-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
