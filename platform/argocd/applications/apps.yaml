apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-namespaces
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "10"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://github.com/sauravrana646/otel-chaos-poc.git
    targetRevision: main
    path: platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-cnpg-operator
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "30"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.26.0
    helm:
      valuesObject:
        crds:
          create: true
        monitoring:
          podMonitorEnabled: false
          grafanaDashboard:
            create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-poc-cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-otel-operator
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "30"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.124.0
    helm:
      valuesObject:
        manager:
          collectorImage:
            repository: otel/opentelemetry-collector-k8s
        admissionWebhooks:
          namespaceSelector:
            matchLabels:
              otel-injection: enabled
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-poc-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-poc-jaeger
  namespace: argocd
  annotations:
    poc.otel/bootstrap-order: "40"
  labels:
    app.kubernetes.io/part-of: otel-chaos-poc
spec:
  project: otel-chaos-poc
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: 4.12.0
    helm:
      releaseName: jaeger
      valuesObject:
        extraObjects:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: jaeger-data
              annotations:
                argocd.argoproj.io/sync-wave: "-1"
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: local-path
              resources:
                requests:
                  storage: 5Gi
        userconfig:
          service:
            extensions: [jaeger_storage, jaeger_query, healthcheckv2]
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [jaeger_storage_exporter]
          extensions:
            healthcheckv2:
              use_v2: true
              http:
                endpoint: 0.0.0.0:13133
            jaeger_query:
              storage:
                traces: primary_store
            jaeger_storage:
              backends:
                primary_store:
                  badger:
                    directories:
                      keys: /badger/data/keys
                      values: /badger/data/values
                    ephemeral: false
                    ttl:
                      spans: 24h
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch: {}
          exporters:
            jaeger_storage_exporter:
              trace_storage: primary_store
        jaeger:
          replicas: 1
          extraVolumes:
            - name: badger-data
              persistentVolumeClaim:
                claimName: jaeger-data
          extraVolumeMounts:
            - name: badger-data
              mountPath: /badger
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-poc-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
