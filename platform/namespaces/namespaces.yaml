apiVersion: v1
kind: Namespace
metadata:
  name: otel-poc-apps
  labels:
    poc.otel/part-of: otel-chaos-poc
    # Used by OTel operator webhook namespace selector
    otel-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: otel-poc-tests
  labels:
    poc.otel/part-of: otel-chaos-poc
