apiVersion: v1
kind: Namespace
metadata:
  name: otel-poc-cnpg-system
  labels:
    poc.otel/part-of: otel-chaos-poc
---
apiVersion: v1
kind: Namespace
metadata:
  name: otel-poc-observability
  labels:
    poc.otel/part-of: otel-chaos-poc
