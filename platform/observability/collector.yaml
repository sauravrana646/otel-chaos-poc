apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel-poc-observability
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      resource:
        attributes:
          - key: deployment.environment
            value: poc
            action: upsert
      filter/drop_health:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.route"] == "/healthz"'
            - 'attributes["http.route"] == "/readyz"'
            - 'IsMatch(attributes["http.route"], "^/actuator.*")'
            - 'attributes["url.path"] == "/healthz"'
            - 'attributes["url.path"] == "/readyz"'
      batch:
        send_batch_size: 512
        timeout: 5s
    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]
        dimensions:
          - name: http.method
          - name: http.status_code
        exemplars:
          enabled: true
      servicegraph:
        latency_histogram_buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000]
    exporters:
      otlp/tempo:
        endpoint: tempo.otel-poc-observability.svc:4317
        tls:
          insecure: true
      otlp/jaeger:
        endpoint: jaeger.otel-poc-observability.svc:4317
        tls:
          insecure: true
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true
      otlphttp/loki:
        endpoint: http://loki.otel-poc-observability.svc:3100/otlp
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_health, resource, batch]
          exporters: [otlp/tempo, otlp/jaeger, spanmetrics, servicegraph]
        metrics:
          receivers: [otlp, spanmetrics, servicegraph]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-poc-observability
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      annotations:
        checksum/collector-config: "826c45bf300d09f0a5c550540b720400e11b93182567f743ebd472841200eda2"
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: ["--config=/conf/relay.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel-poc-observability
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8889
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: otel-poc-observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  endpoints:
    - port: metrics
      interval: 30s
