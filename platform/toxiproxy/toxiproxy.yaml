apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy-config
  namespace: otel-poc-apps
data:
  config.json: |
    [
      {
        "name": "postgres",
        "listen": "0.0.0.0:5432",
        "upstream": "poc-postgres-rw:5432",
        "enabled": true
      },
      {
        "name": "llm-http",
        "listen": "0.0.0.0:8080",
        "upstream": "python-llm:8080",
        "enabled": true
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: otel-poc-apps
  labels:
    app.kubernetes.io/name: toxiproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toxiproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toxiproxy
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          args: ["-host", "0.0.0.0", "-config", "/config/config.json"]
          ports:
            - name: api
              containerPort: 8474
            - name: postgres
              containerPort: 5432
            - name: llm-http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: otel-poc-apps
  labels:
    app.kubernetes.io/name: toxiproxy
spec:
  selector:
    app.kubernetes.io/name: toxiproxy
  ports:
    - name: api
      port: 8474
      targetPort: api
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy-llm
  namespace: otel-poc-apps
  labels:
    app.kubernetes.io/name: toxiproxy
spec:
  selector:
    app.kubernetes.io/name: toxiproxy
  ports:
    - name: llm-http
      port: 8080
      targetPort: llm-http
